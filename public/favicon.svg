<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Outer border -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="5" stroke="#7c6fff" stroke-width="1.5"/>
  <!-- Left filled block -->
  <rect x="1.5" y="1.5" width="14.5" height="29" rx="5" fill="#7c6fff"/>
  <rect x="10" y="1.5" width="6" height="29" fill="#7c6fff"/>
  <!-- Divider line -->
  <line x1="16" y1="1.5" x2="16" y2="30.5" stroke="#7c6fff" stroke-width="1.5"/>
  <!-- Left S (white, on filled bg) -->
  <text x="8.5" y="22" font-family="'Poppins', 'Arial Black', sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">S</text>
  <!-- Right S (ink color, on dark bg) -->
  <text x="24" y="22" font-family="'Poppins', 'Arial Black', sans-serif" font-weight="900" font-size="16" fill="#7c6fff" text-anchor="middle">S</text>
</svg>
